[package]
name = "voice-input-linux"
version = "0.1.0"
edition = "2021"

[features]
default = []
ibus = []

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
voice-input-audio = { path = "../voice-input-audio" }
voice-input-asr = { path = "../voice-input-asr" }
voice-input-core = { path = "../voice-input-core" }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3.6"
cpal = "0.16"
device_query = "4.0"
fs2 = "0.4"
hound = "3.5"
ksni = { version = "0.3", features = ["blocking"] }
