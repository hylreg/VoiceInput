<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VoiceInput 手机输入</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-height: 100vh;
    background: #17181c; color: #e8e8ea;
    font: 16px/1.5 -apple-system, "Noto Sans CJK SC", sans-serif;
    display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  #notice { font-size: 13px; color: #9a9aa2; min-height: 1.2em; }
  #notice.error { color: #ff6b6b; }
  #notice.ok { color: #51cf66; }
  textarea {
    flex: 1 1 auto; min-height: 30vh; width: 100%;
    padding: 12px; border-radius: 10px; resize: vertical;
    background: #22232a; color: inherit; font: inherit;
    border: 1px solid #34353d;
  }
  textarea:focus { outline: 2px solid #4c8bf5; border-color: transparent; }
  /* 自动发送开关：默认开，状态存 localStorage。 */
  #autorow {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: #b9b9c1; user-select: none;
  }
  #autorow input { width: 18px; height: 18px; accent-color: #4c8bf5; }
  button {
    width: 100%; padding: 18px; font-size: 18px; font-weight: 600;
    border: 0; border-radius: 10px; background: #4c8bf5; color: #fff;
  }
  button:disabled { background: #3a3b44; color: #8a8a92; }
  #history { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #history li {
    padding: 8px 10px; border-radius: 8px; margin-bottom: 6px;
    background: #22232a; word-break: break-word;
  }
  #history li.failed { background: #3a1f22; color: #ffb3b3; }
  #history time { color: #7a7a82; margin-right: 8px; }
  /* 收到 401 时展开，让用户粘贴新地址换口令。默认收起。 */
  #reconnect {
    display: none; flex-direction: column; gap: 8px;
    padding: 12px; border-radius: 10px; background: #3a1f22;
  }
  #reconnect.show { display: flex; }
  #reconnect p { margin: 0; font-size: 13px; color: #ffb3b3; }
  #reconnect input {
    width: 100%; padding: 12px; border-radius: 10px;
    background: #22232a; color: inherit; font: inherit;
    border: 1px solid #34353d;
  }
  #reconnect input:focus { outline: 2px solid #4c8bf5; border-color: transparent; }
  #reconnect button { padding: 14px; font-size: 16px; }
</style>
</head>
<body>
<h1>VoiceInput 手机输入</h1>
<p id="notice"></p>
<textarea id="text" autofocus placeholder="用输入法的语音键说话"></textarea>
<label id="autorow">
  <input id="auto" type="checkbox">
  <span>说完自动发送</span>
</label>
<button id="send">发送</button>
<div id="reconnect">
  <p>口令已变更，请从托盘菜单重新复制地址</p>
  <input id="newaddr" type="text" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="粘贴托盘菜单复制的完整地址">
  <button id="apply">使用新地址</button>
</div>
<ul id="history"></ul>
<script>
(function () {
  var TEXT = document.getElementById('text');
  var SEND = document.getElementById('send');
  var AUTO = document.getElementById('auto');
  var NOTICE = document.getElementById('notice');
  var HISTORY = document.getElementById('history');
  var RECONNECT = document.getElementById('reconnect');
  var NEWADDR = document.getElementById('newaddr');
  var APPLY = document.getElementById('apply');
  var LS_HISTORY = 'voiceinput.history';
  var LS_AUTO = 'voiceinput.auto';
  // 首选信号是 compositionend——手机输入法录完一段会发它，我们不必再等静默。
  // IDLE_MS 是兜底：不发这个事件的输入法、以及纯手打，都靠停笔判定。
  var IDLE_MS = 600;
  // 收到 compositionend 后再等这么一下。有些输入法先发 compositionend 再补发
  // input，那一刻 TEXT.value 还是旧的，立刻读会读到空的。
  var SETTLE_MS = 50;
  // 合成开着但一直不结束的看门狗。只为解开 composing 这个闩，不直接发。
  var COMPOSING_STUCK_MS = 5000;
  var idleTimer = null;
  var fastTimer = null;
  var composingTimer = null;
  var busy = false;
  // 合成是否正在进行。合成期间输入法吐的是还没定稿的中间结果，这时候
  // 绝不能发——见 canAutoSend 处的说明。
  var composing = false;
  // 合成期间是否见过按键。见 compositionend 处的说明。
  var typedWhileComposing = false;
  // 上次自动发送失败了。此时不能再自动发：输入框里留着的是那句没发出去的
  // 半截话，直接发会把新一句和它拼在一起注入。要用户改一笔才恢复。
  var autoHalted = false;

  // 页面的地址就是凭据：口令是路径第一段，接口挂在同一层。
  // 用相对地址发请求，换口令、换主机都不用改页面。末尾补斜杠，
  // 好让用户手打的 /<口令>（不带斜杠）也能解析出同一个基准。
  var BASE = location.pathname;
  if (BASE.charAt(BASE.length - 1) !== '/') { BASE += '/'; }
  // 路径第一段就是口令。拿到手只为判空——真正认它的是服务端。
  var PREFIX = BASE.split('/')[1] || '';

  // 服务端在口令不对时回 401。文案与服务端 MSG_UNAUTHORIZED 保持一致，
  // 客户端用同一条常量比对，改文案时不会漏掉这一处。
  var AUTH_FAILED = '口令已变更，请从托盘菜单重新复制地址';

  function notice(text, kind) {
    NOTICE.textContent = text || '';
    NOTICE.className = kind || '';
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(LS_HISTORY) || '[]'); }
    catch (e) { return []; }
  }
  function saveHistory(rows) {
    try { localStorage.setItem(LS_HISTORY, JSON.stringify(rows.slice(-50))); }
    catch (e) { /* 存不下就算了，页面本身可用 */ }
  }

  function render() {
    var rows = loadHistory();
    HISTORY.innerHTML = '';
    rows.slice().reverse().forEach(function (row) {
      var li = document.createElement('li');
      if (row.failed) { li.className = 'failed'; }
      var time = document.createElement('time');
      time.textContent = row.time;
      li.appendChild(time);
      li.appendChild(document.createTextNode(row.text));
      HISTORY.appendChild(li);
    });
  }

  function push(text, failed) {
    var rows = loadHistory();
    rows.push({
      text: text,
      failed: !!failed,
      time: new Date().toTimeString().slice(0, 8)
    });
    saveHistory(rows);
    render();
  }

  function showReconnect() {
    clearTimers();
    // 自动发送整个停摆了，合成的闩也一并清掉。否则用户粘好新地址、开关恢复之后，
    // 这个闩还挂着，得等 5 秒看门狗才自己解开——修好了却几秒钟没反应。
    composing = false;
    clearComposingWatchdog();
    RECONNECT.className = 'show';
    SEND.disabled = true;
    AUTO.disabled = true;
    NEWADDR.focus();
  }

  // 没有 hideReconnect 了：换地址走整页跳转，重新加载后粘贴框本来就是收起的。

  // 口令在路径里，所以不再需要任何鉴权头：请求打到 BASE 下就是凭据本身。
  // Content-Type 只有 POST 需要，但统一带上无副作用（同源，不触发预检）。
  function authHeaders() {
    return { 'Content-Type': 'application/json' };
  }

  // ---- 自动发送：输入法报「输入完成」就发；不发这个事件时靠停笔兜底 ----

  // 能不能自动发。两个容易写错的地方：
  //   1. 用 AUTO.disabled 而不是只看 AUTO.checked——口令失效时只是把开关置灰，
  //      checked 仍是 true，光看它会在用户换地址时继续发。
  //   2. composing / autoHalted 期间一律不发，理由见各自的注释。
  function canAutoSend() {
    return AUTO.checked && !AUTO.disabled && !busy && !composing &&
      !autoHalted && !!TEXT.value.trim();
  }

  function clearTimers() {
    if (idleTimer !== null) { clearTimeout(idleTimer); idleTimer = null; }
    if (fastTimer !== null) { clearTimeout(fastTimer); fastTimer = null; }
  }

  // 看门狗：合成开着却一直不结束时解锁。
  //
  // 必须由每个 input 事件续期，不能只在 compositionstart 挂一次——否则一段
  // 说上 5 秒的语音会被误判成卡死，中途把半截话发出去。所以它的语义是
  // 「合成中、且 5 秒内一个 input 都没有」才算卡住。
  function armComposingWatchdog() {
    if (composingTimer !== null) { clearTimeout(composingTimer); }
    composingTimer = setTimeout(function () {
      composingTimer = null;
      composing = false;
      // 只解锁，不直接发——让停笔兜底按正常节奏接手。
      armIdle();
    }, COMPOSING_STUCK_MS);
  }

  function clearComposingWatchdog() {
    if (composingTimer !== null) { clearTimeout(composingTimer); composingTimer = null; }
  }

  // 收到 compositionend 后再等 SETTLE_MS 才发。为什么要等：
  // 有的输入法先发 compositionend 再补发 input，那一刻 TEXT.value 还是旧的，
  // 立刻读会读到空的；也有输入法把一句话拆成几次 composition，中间那次
  // compositionend 之后几十毫秒就接着续上。等一小下，两种情况都能收敛。
  function armFast() {
    if (fastTimer !== null) { clearTimeout(fastTimer); }
    fastTimer = setTimeout(function () {
      fastTimer = null;
      // 这 50ms 里如果又开始合成新一段，这里自然拦住。
      if (!canAutoSend()) { return; }
      send();
    }, SETTLE_MS);
  }

  // 停笔兜底。只管「静默够了就发」这一件事；合成期间发不得，由
  // canAutoSend() 里的 composing 拦，解锁则是看门狗的职责。
  function armIdle() {
    if (!canAutoSend()) { return; }
    if (idleTimer !== null) { clearTimeout(idleTimer); }
    idleTimer = setTimeout(function () {
      idleTimer = null;
      if (!canAutoSend()) { return; }
      send();
    }, IDLE_MS);
  }

  function send() {
    var text = TEXT.value.trim();
    if (!text) { notice('文本为空', 'error'); return; }
    SEND.disabled = true;
    AUTO.disabled = true;
    busy = true;
    notice('检查本机状态…');

    fetch(BASE + 'api/status', { headers: authHeaders() })
      .then(function (res) {
        if (res.status === 401) { throw new Error(AUTH_FAILED); }
        if (!res.ok) { throw new Error('状态查询失败（' + res.status + '）'); }
        return res.json();
      })
      .then(function (state) {
        if (!state.bridge_enabled) { throw new Error('手机输入已关闭，请在托盘菜单里开启'); }
        if (state.mic_recording) { throw new Error('本机正在录音，稍后重试'); }
        notice('发送中…');
        return fetch(BASE + 'send', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ text: text })
        });
      })
      .then(function (res) {
        if (res.status === 401) { throw new Error(AUTH_FAILED); }
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (res.ok) {
            push(text, false);
            // 发送期间用户可能已经在说下一句了。只有输入框还是我们刚发出去的那段
            // 才清空，否则会把新内容一起抹掉——那是静默丢字。
            if (TEXT.value.trim() === text) {
              TEXT.value = '';
            }
            TEXT.focus();
            notice('已注入本机光标', 'ok');
            busy = false;
            SEND.disabled = false;
            AUTO.disabled = false;
            // 上一句发成功，闩解开。下面若还有内容（发送期间又说的），重新计时。
            autoHalted = false;
            if (TEXT.value.trim()) { armIdle(); }
            return;
          }
          throw new Error(data.error || ('发送失败（' + res.status + '）'));
        });
      })
      .catch(function (err) {
        push(text, true);
        notice(err.message, 'error');
        busy = false;
        // GET /api/status 与 POST /send 的 401 都要展开粘贴框。
        // 这条路径不算自动发送失败：闩留给下面那些「重试一下就能好」的错。
        if (err.message === AUTH_FAILED) { showReconnect(); return; }
        SEND.disabled = false;
        // 自动发送失败不重试——否则本机录音中或口令失效会变成死循环刷屏。
        // 而且这句没发出去的话还留在输入框里，再自动发会把下一句和它拼在
        // 一起注入。置上闩，等用户明确处理。
        autoHalted = true;
        AUTO.disabled = false;
        // 闩上之后页面确实不会再自动发了，而服务端文案常带「稍后重试」——
        // 照着等下去就是无限期干等。把真实情况和手机上做得到的恢复动作写清楚：
        // 手机上多半没有硬件键盘，keydown 那条路指望不上，只剩「发送」按钮和开关。
        notice(err.message + '。自动发送已暂停：点「发送」重试，或关掉再打开「说完自动发送」', 'error');
      });
  }

  // 口令在路径里，换口令等于换页面地址——只有重新加载才有意义
  // （新口令得由服务端在路由里认，改内存里的变量是改不出来的）。
  function applyNewAddress() {
    var addr = NEWADDR.value.trim();
    // 只认「主机 + 一段非空路径」。路径第一段就是口令，所以裸主机（`http://h:8765/`）、
    // 空路径段（`//x`）、多段路径都会被服务端 401 或 404 掉——与其让用户跳过去
    // 再看一屏「口令已变更」，不如在这里就说地址不对。
    if (!/^https?:\/\/[^/]+\/[^/]+/.test(addr)) {
      // 保持区域展开，让用户接着改。
      notice('地址不对，请粘贴托盘菜单「复制外部输入地址」给出的完整链接', 'error');
      RECONNECT.className = 'show';
      return;
    }
    // 直接跳转，不做任何本地状态清理——重新加载后一切都是新的。
    location.href = addr;
  }

  SEND.addEventListener('click', send);

  // 改了字就重新计时，所以不会发旧的。
  TEXT.addEventListener('input', function () {
    // 合成还在进行：给看门狗续期。不续的话，一段超过 5 秒的语音会被误判成
    // 「合成卡死」，中途解开闩——之后说话稍一停顿，半截话就被发出去。
    if (composing) { armComposingWatchdog(); }
    // 停笔计时一律作废：新输入就是新的一句，旧的那次不能算数。
    if (idleTimer !== null) { clearTimeout(idleTimer); idleTimer = null; }
    // 但快路（刚收到 compositionend）要留着——有些输入法正是先发
    // compositionend 再补发这个 input，把它清掉就等于每次都白等 600ms，
    // 那正是我们要摆脱的延迟。
    if (fastTimer !== null) { return; }
    if (TEXT.value.trim()) { armIdle(); } else { notice(''); }
  });

  // 输入法说「这段输入结束了」——语音键录完就会发这个事件，不用再等静默。
  //
  // 但 compositionend 对手打中文也会发。区分办法：手打必然伴随 keydown，
  // 语音插入则没有按键。合成期间出现过 keydown 就说明是人手打的，
  // 退回停笔计时——用户多敲一笔就是新的一句，不该被立刻发出去。
  TEXT.addEventListener('compositionstart', function () {
    composing = true;
    typedWhileComposing = false;
    armComposingWatchdog();
  });

  TEXT.addEventListener('compositionend', function () {
    clearTimers();
    clearComposingWatchdog();
    composing = false;
    // 用完就清。否则一次手打会把这个标志永久置真，之后的语音输入
    // 就再也走不到「立刻发」那条路了。
    var typed = typedWhileComposing;
    typedWhileComposing = false;
    if (!canAutoSend()) { return; }
    // 手打的不立刻发：用户多敲一笔就是新的一句。语音的走快路，
    // 但也等 SETTLE_MS，好让「compositionend 先于 input」的输入法定稿。
    if (typed) { armIdle(); } else { armFast(); }
  });

  AUTO.addEventListener('change', function () {
    clearTimers();
    try { localStorage.setItem(LS_AUTO, AUTO.checked ? '1' : '0'); }
    catch (e) { /* 存不下就用本次的 */ }
    // 关掉再打开，等于明确说「别再卡着」——把失败留下的闩一起解开。
    if (AUTO.checked) { autoHalted = false; }
    if (canAutoSend()) { armIdle(); }
  });

  APPLY.addEventListener('click', applyNewAddress);
  // 回车不发送：手机语音输入会插入换行，回车当发送必然误触。
  // 顺带记录按键——手打与语音插入靠它区分，见 compositionend 处。
  // 也顺手解开发送失败留下的闩：用户回来动了键盘，就是要接着用的意思。
  TEXT.addEventListener('keydown', function (event) {
    typedWhileComposing = true;
    autoHalted = false;
    if (event.key === 'Enter') { event.preventDefault(); }
  });
  NEWADDR.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') { event.preventDefault(); applyNewAddress(); }
  });

  // 默认开：这类页面不该逼用户每说一句点一次按钮。
  var autoStored = null;
  try { autoStored = localStorage.getItem(LS_AUTO); }
  catch (e) { /* 读不到就用默认 */ }
  AUTO.checked = autoStored === null ? true : autoStored === '1';

  if (!PREFIX) {
    // 口令就在路径第一段。走到这里说明地址压根没带口令段（例如只开了裸地址），
    // 服务端其实已经在路由之前回 401 了，这段是给「页面被本地存下来又打开」兜底。
    notice('地址不完整，请用托盘菜单「复制外部输入地址」给出的完整链接打开', 'error');
    SEND.disabled = true;
    AUTO.disabled = true;
  }
  render();
})();
</script>
</body>
</html>
