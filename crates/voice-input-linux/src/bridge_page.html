<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VoiceInput 手机输入</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-height: 100vh;
    background: #17181c; color: #e8e8ea;
    font: 16px/1.5 -apple-system, "Noto Sans CJK SC", sans-serif;
    display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  #notice { font-size: 13px; color: #9a9aa2; min-height: 1.2em; }
  #notice.error { color: #ff6b6b; }
  #notice.ok { color: #51cf66; }
  textarea {
    flex: 1 1 auto; min-height: 30vh; width: 100%;
    padding: 12px; border-radius: 10px; resize: vertical;
    background: #22232a; color: inherit; font: inherit;
    border: 1px solid #34353d;
  }
  textarea:focus { outline: 2px solid #4c8bf5; border-color: transparent; }
  /* 自动发送开关：默认开，状态存 localStorage。 */
  #autorow {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: #b9b9c1; user-select: none;
  }
  #autorow input { width: 18px; height: 18px; accent-color: #4c8bf5; }
  button {
    width: 100%; padding: 18px; font-size: 18px; font-weight: 600;
    border: 0; border-radius: 10px; background: #4c8bf5; color: #fff;
  }
  button:disabled { background: #3a3b44; color: #8a8a92; }
  #history { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #history li {
    padding: 8px 10px; border-radius: 8px; margin-bottom: 6px;
    background: #22232a; word-break: break-word;
  }
  #history li.failed { background: #3a1f22; color: #ffb3b3; }
  #history time { color: #7a7a82; margin-right: 8px; }
  /* 收到 401 时展开，让用户粘贴新地址换 token。默认收起。 */
  #reconnect {
    display: none; flex-direction: column; gap: 8px;
    padding: 12px; border-radius: 10px; background: #3a1f22;
  }
  #reconnect.show { display: flex; }
  #reconnect p { margin: 0; font-size: 13px; color: #ffb3b3; }
  #reconnect input {
    width: 100%; padding: 12px; border-radius: 10px;
    background: #22232a; color: inherit; font: inherit;
    border: 1px solid #34353d;
  }
  #reconnect input:focus { outline: 2px solid #4c8bf5; border-color: transparent; }
  #reconnect button { padding: 14px; font-size: 16px; }
</style>
</head>
<body>
<h1>VoiceInput 手机输入</h1>
<p id="notice"></p>
<textarea id="text" autofocus placeholder="用输入法的语音键说话"></textarea>
<label id="autorow">
  <input id="auto" type="checkbox">
  <span>说完自动发送</span>
</label>
<button id="send">发送</button>
<div id="reconnect">
  <p>token 已变更，请从托盘重新复制地址</p>
  <input id="newaddr" type="text" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="粘贴托盘菜单复制的完整地址">
  <button id="apply">使用新地址</button>
</div>
<ul id="history"></ul>
<script>
(function () {
  var TEXT = document.getElementById('text');
  var SEND = document.getElementById('send');
  var AUTO = document.getElementById('auto');
  var NOTICE = document.getElementById('notice');
  var HISTORY = document.getElementById('history');
  var RECONNECT = document.getElementById('reconnect');
  var NEWADDR = document.getElementById('newaddr');
  var APPLY = document.getElementById('apply');
  var LS_HISTORY = 'voiceinput.history';
  var LS_TOKEN = 'voiceinput.token';
  var LS_AUTO = 'voiceinput.auto';
  // 首选信号是 compositionend——手机输入法在「这段话录完了」时发它，
  // 我们不必再等一段静默去猜。IDLE_MS 只是兜底：个别输入法不合成、不发
  // 这个事件（或用户是手打的），那时仍靠停笔判定。
  var IDLE_MS = 600;
  var idleTimer = null;
  var busy = false;
  // 合成期间是否见过按键。见 compositionend 处的说明。
  var typedWhileComposing = false;

  function parseToken(text) {
    var match = /(?:^|[#&])k=([0-9a-fA-F]+)/.exec(text || '');
    return match ? match[1] : '';
  }

  function readFragmentToken() {
    return parseToken(location.hash || '');
  }

  // fragment 只发一次；存进 localStorage 之后开裸地址也能用。
  var fragmentToken = readFragmentToken();
  if (fragmentToken) { localStorage.setItem(LS_TOKEN, fragmentToken); }
  var TOKEN = fragmentToken || localStorage.getItem(LS_TOKEN) || '';

  function notice(text, kind) {
    NOTICE.textContent = text || '';
    NOTICE.className = kind || '';
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(LS_HISTORY) || '[]'); }
    catch (e) { return []; }
  }
  function saveHistory(rows) {
    try { localStorage.setItem(LS_HISTORY, JSON.stringify(rows.slice(-50))); }
    catch (e) { /* 存不下就算了，页面本身可用 */ }
  }

  function render() {
    var rows = loadHistory();
    HISTORY.innerHTML = '';
    rows.slice().reverse().forEach(function (row) {
      var li = document.createElement('li');
      if (row.failed) { li.className = 'failed'; }
      var time = document.createElement('time');
      time.textContent = row.time;
      li.appendChild(time);
      li.appendChild(document.createTextNode(row.text));
      HISTORY.appendChild(li);
    });
  }

  function push(text, failed) {
    var rows = loadHistory();
    rows.push({
      text: text,
      failed: !!failed,
      time: new Date().toTimeString().slice(0, 8)
    });
    saveHistory(rows);
    render();
  }

  function showReconnect() {
    clearTimers();
    RECONNECT.className = 'show';
    SEND.disabled = true;
    AUTO.disabled = true;
    NEWADDR.focus();
  }

  function hideReconnect() {
    RECONNECT.className = '';
    NEWADDR.value = '';
    SEND.disabled = false;
    AUTO.disabled = false;
  }

  function authHeaders() {
    return { 'X-Auth-Token': TOKEN, 'Content-Type': 'application/json' };
  }

  // ---- 自动发送：输入法报「输入完成」就发；不发这个事件时靠停笔兜底 ----

  function clearTimers() {
    if (idleTimer !== null) { clearTimeout(idleTimer); idleTimer = null; }
  }

  function armIdle() {
    if (!AUTO.checked || busy) { return; }
    if (idleTimer !== null) { clearTimeout(idleTimer); }
    idleTimer = setTimeout(function () {
      idleTimer = null;
      // 兜底路径也要自己再确认一遍：计时器挂上之后开关可能被关掉、
      // 请求可能已经上路了。
      if (!AUTO.checked || busy || !TEXT.value.trim()) { return; }
      send();
    }, IDLE_MS);
  }

  function send() {
    var text = TEXT.value.trim();
    if (!text) { notice('文本为空', 'error'); return; }
    SEND.disabled = true;
    AUTO.disabled = true;
    busy = true;
    notice('检查本机状态…');

    fetch('/api/status', { headers: authHeaders() })
      .then(function (res) {
        if (res.status === 401) { throw new Error('token 已变更，请从托盘菜单重新复制地址'); }
        if (!res.ok) { throw new Error('状态查询失败（' + res.status + '）'); }
        return res.json();
      })
      .then(function (state) {
        if (!state.bridge_enabled) { throw new Error('手机输入已关闭，请在托盘菜单里开启'); }
        if (state.mic_recording) { throw new Error('本机正在录音，稍后重试'); }
        notice('发送中…');
        return fetch('/send', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ text: text })
        });
      })
      .then(function (res) {
        if (res.status === 401) { throw new Error('token 已变更，请从托盘菜单重新复制地址'); }
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (res.ok) {
            push(text, false);
            // 发送期间用户可能已经在说下一句了。只有输入框还是我们刚发出去的那段
            // 才清空，否则会把新内容一起抹掉——那是静默丢字。
            if (TEXT.value.trim() === text) {
              TEXT.value = '';
            }
            TEXT.focus();
            notice('已注入本机光标', 'ok');
            busy = false;
            SEND.disabled = false;
            AUTO.disabled = false;
            if (TEXT.value.trim()) { armIdle(); }
            return;
          }
          throw new Error(data.error || ('发送失败（' + res.status + '）'));
        });
      })
      .catch(function (err) {
        push(text, true);
        notice(err.message, 'error');
        busy = false;
        // GET /api/status 与 POST /send 的 401 都要展开粘贴框。
        if (/token 已变更/.test(err.message)) { showReconnect(); return; }
        SEND.disabled = false;
        // 自动发送失败不重试——否则本机录音中或 token 失效会变成死循环刷屏。
        // 文字留在输入框里，等用户改一笔才会重新计时。
        AUTO.disabled = false;
      });
  }

  // 从粘贴的完整地址（或含 #k=... 的片段）里取 token，与 location.hash 同一套解析。
  function applyNewAddress() {
    var token = parseToken(NEWADDR.value.trim());
    if (!token) {
      // 保持区域展开，让用户接着改。
      notice('没找到 token，请粘贴托盘菜单「复制外部输入地址」给出的完整链接', 'error');
      RECONNECT.className = 'show';
      return;
    }
    TOKEN = token;
    try { localStorage.setItem(LS_TOKEN, token); }
    catch (e) { /* 存不下也能用，只是下次开裸地址得重新粘 */ }
    hideReconnect();
    notice('已更新 token，可以继续发送', 'ok');
  }

  SEND.addEventListener('click', send);

  // 停笔兜底计时。任何输入都重置，所以改了字就不会发旧的。
  TEXT.addEventListener('input', function () {
    clearTimers();
    if (TEXT.value.trim()) { armIdle(); } else { notice(''); }
  });

  // 输入法说「这段输入结束了」——语音键录完就会发这个事件，不用再等静默。
  //
  // 但 compositionend 对手打中文也会发。区分办法：手打必然伴随 keydown，
  // 语音插入则没有按键。合成期间出现过 keydown 就说明是人手打的，
  // 退回停笔计时——用户多敲一笔就是新的一句，不该被立刻发出去。
  TEXT.addEventListener('compositionstart', function () {
    typedWhileComposing = false;
  });

  TEXT.addEventListener('compositionend', function () {
    clearTimers();
    // 用完就清。否则一次手打会把这个标志永久置真，之后的语音输入
    // 就再也走不到「立刻发」那条路了。
    var typed = typedWhileComposing;
    typedWhileComposing = false;
    if (!AUTO.checked || busy || !TEXT.value.trim()) { return; }
    if (typed) { armIdle(); } else { send(); }
  });

  AUTO.addEventListener('change', function () {
    clearTimers();
    try { localStorage.setItem(LS_AUTO, AUTO.checked ? '1' : '0'); }
    catch (e) { /* 存不下就用本次的 */ }
    if (AUTO.checked && TEXT.value.trim()) { armIdle(); }
  });

  APPLY.addEventListener('click', applyNewAddress);
  // 回车不发送：手机语音输入会插入换行，回车当发送必然误触。
  // 顺带记录按键——手打与语音插入靠它区分，见 compositionend 处。
  TEXT.addEventListener('keydown', function (event) {
    typedWhileComposing = true;
    if (event.key === 'Enter') { event.preventDefault(); }
  });
  NEWADDR.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') { event.preventDefault(); applyNewAddress(); }
  });

  // 默认开：这类页面不该逼用户每说一句点一次按钮。
  var autoStored = null;
  try { autoStored = localStorage.getItem(LS_AUTO); }
  catch (e) { /* 读不到就用默认 */ }
  AUTO.checked = autoStored === null ? true : autoStored === '1';

  if (!TOKEN) {
    notice('缺少 token，请用托盘菜单「复制外部输入地址」给出的完整链接打开', 'error');
    SEND.disabled = true;
    AUTO.disabled = true;
  }
  render();
})();
</script>
</body>
</html>
